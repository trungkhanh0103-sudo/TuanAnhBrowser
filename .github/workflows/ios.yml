name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'TuanAnhBrowser-iOS.zip'
      - '.github/workflows/ios.yml'

env:
  DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare & Extract ZIP
        run: |
          mkdir -p source
          unzip -q -o TuanAnhBrowser-iOS.zip -d source/
          echo "✅ Giải nén xong!"

      - name: Find Xcode project
        id: find-project
        run: |
          PROJECT=$(find source -name "*.xcodeproj" -maxdepth 3 | head -1)
          if [ -z "$PROJECT" ]; then
            echo "❌ Không tìm thấy file .xcodeproj!"
            exit 1
          fi
          echo "project=$PROJECT" >> $GITHUB_OUTPUT
          echo "✅ Tìm thấy project"

      - name: Detect scheme
        id: detect-scheme
        run: |
          PROJECT_NAME=$(basename "${{ steps.find-project.outputs.project }}" .xcodeproj)
          echo "scheme=$PROJECT_NAME" >> $GITHUB_OUTPUT

      - name: Build iOS
        run: |
          PROJECT="${{ steps.find-project.outputs.project }}"
          SCHEME="${{ steps.detect-scheme.outputs.scheme }}"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/archive.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/archive.xcarchive/Products/Applications/*.app Payload/
          zip -qr TuanAnhBrowser.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TuanAnhBrowser-iPA
          path: TuanAnhBrowser.ipa
